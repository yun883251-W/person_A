name: tests

# 离线测试：不联网、不读凭据、不消耗提供方额度。
# 在线探测（test_live_provider_schema.py）由 mcp-live-schema.yml 手动触发，此处跳过。
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地 LLF 环境的 3.12 保持一致。pyproject 声明 requires-python >=3.10，
          # 若要同时验证 3.10，把这一行换成 matrix 即可。
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,mcp]"

      - name: 运行测试
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: pytest -q
