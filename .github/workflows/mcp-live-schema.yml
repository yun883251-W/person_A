name: mcp-live-schema

# 手动触发的在线探测：把真实发布的工具 Schema 发给真实提供方，确认请求被接受。
# 这是唯一能发现「本地全绿、上线 100% 不可用」的一层。
#
# 只手动触发，不挂在 push 上：它会真实调用提供方并消耗额度，而且失败原因可能是
# 网络抖动而非 Schema 问题，不适合当作提交通道。
#
# 需要配置的仓库 secret / variable：
#   secrets.CHAT_API_KEY   （必需）
#   secrets.CHAT_MODEL     （必需，填写实际可用的模型名）
#   vars.CHAT_PROVIDER     （可选，默认 deepseek）
#   vars.CHAT_BASE_URL     （可选，默认 https://api.deepseek.com）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 检查凭据
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
        run: |
          if [ -z "$CHAT_API_KEY" ]; then
            echo "::error::仓库未配置 CHAT_API_KEY secret，在线探测无法运行"
            exit 1
          fi

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,mcp]"

      - name: 在线探测
        env:
          PERSON_A_LIVE_SCHEMA_PROBE: "1"
          PYTHONPATH: src
          PYTHONUTF8: "1"
          CHAT_PROVIDER: ${{ vars.CHAT_PROVIDER || 'deepseek' }}
          CHAT_BASE_URL: ${{ vars.CHAT_BASE_URL || 'https://api.deepseek.com' }}
          CHAT_MODEL: ${{ secrets.CHAT_MODEL }}
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
        run: pytest tests/integration/mcp/test_live_provider_schema.py -v
