[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "person-a-knowledge-agent"
version = "0.1.0"
description = "基于本地 Markdown 文档的知识库问答 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["langchain-deepseek>=0.1", "langchain-ollama>=0.2"]

[project.scripts]
person-a = "knowledge_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
