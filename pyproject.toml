[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "person-a-knowledge-agent"
version = "1.0.0"
description = "带混合检索、可信引用、MCP 工具、多轮状态与可观测性的本地知识库 Agent"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["rag", "agent", "mcp", "langchain", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = ["langchain-deepseek>=0.1", "langchain-ollama>=0.2.2"]

[project.scripts]
person-a = "knowledge_agent.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
browser = ["playwright>=1.50,<2.0", "mcp>=1.26,<2.0", "jsonschema>=4.23,<5.0"]
dev = ["pytest>=7.0", "httpx>=0.27,<1.0"]
mcp = ["mcp>=1.26,<2.0", "jsonschema>=4.23,<5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
cache_dir = ".pytest_cache"
addopts = "--basetemp=.pytest-tmp"
markers = [
    "live: 真实提供方在线探测；默认跳过，需由对应用例的环境变量显式开启",
]
