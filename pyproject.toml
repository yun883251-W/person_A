[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "person-a-knowledge-agent"
version = "0.1.0"
description = "基于本地 Markdown 文档的知识库问答 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["langchain-deepseek>=0.1", "langchain-ollama>=0.2.2"]

[project.scripts]
person-a = "knowledge_agent.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
dev = ["pytest>=7.0", "httpx>=0.27,<1.0"]
mcp = ["mcp>=1.26,<2.0", "jsonschema>=4.23,<5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: 会把工具 Schema 发给真实提供方的在线探测；默认跳过，需设置 PERSON_A_LIVE_SCHEMA_PROBE=1",
]
